<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f8f7f2">
<title>Phuket Property | Find Your Place</title>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root {
  --green: #173d31;
  --green2: #285644;
  --gold: #c9a665;
  --cream: #f8f7f2;
  --paper: #fffefa;
  --ink: #1a2d25;
  --muted: #78847b;
  --line: #e6e7de;
  --soft: #edf1e9;
  --serif: Georgia, "Times New Roman", serif;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--cream);
  color: var(--ink);
  font: 15px/1.6 system-ui, sans-serif;
}
body.lock { overflow: hidden; }
[hidden] { display: none !important; }
img { display: block; max-width: 100%; }
button, input, select, textarea { font: inherit; }
button, a { cursor: pointer; }
a { color: inherit; text-decoration: none; }
button:focus-visible, a:focus-visible,
input:focus-visible, select:focus-visible,
textarea:focus-visible {
  outline: 3px solid var(--gold);
  outline-offset: 3px;
}
.wrap { width: min(1240px, calc(100% - 36px)); margin: auto; }
.eyebrow {
  color: #788a7b;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 2px;
  text-transform: uppercase;
}
.btn {
  border: 0;
  border-radius: 8px;
  padding: 12px 16px;
  font-size: 12px;
  font-weight: 750;
}
.primary { background: var(--green); color: white; }
.primary:hover { background: var(--green2); }
.gold { background: var(--gold); color: var(--ink); }
.light { background: var(--soft); color: var(--green); }

/* Header */
header {
  height: 72px;
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  padding: 0 max(18px, calc((100vw - 1240px) / 2));
  background: #fffefaf2;
  border-bottom: 1px solid var(--line);
  backdrop-filter: blur(14px);
}
.brand {
  display: flex;
  align-items: center;
  gap: 9px;
  color: var(--green);
  white-space: nowrap;
}
.mark {
  width: 35px;
  height: 35px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: #ecf0e7;
  color: var(--gold);
  font-size: 19px;
}
.brand strong {
  font: 700 13px var(--serif);
  letter-spacing: .5px;
}
.brand small {
  display: block;
  margin-top: 3px;
  color: var(--muted);
  font-size: 8px;
  font-weight: 800;
  letter-spacing: 2px;
}
.nav, .nav-actions {
  display: flex;
  align-items: center;
  gap: 19px;
}
.nav a { font-size: 12px; color: #46564c; }
.nav a:hover { color: var(--gold); }
.nav-actions { gap: 8px; }
.menu {
  display: none;
  background: transparent;
  border: 1px solid var(--line);
  color: var(--green);
  font-size: 20px;
}

/* Hero */
.hero { padding-top: 18px; }
.hero-panel {
  position: relative;
  min-height: 425px;
  overflow: hidden;
  border-radius: 16px;
  background: #24483d;
  color: white;
  isolation: isolate;
}
.hero-image {
  position: absolute;
  inset: 0;
  z-index: -2;
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.hero-panel::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -1;
  background: linear-gradient(90deg, #0d241fdf, #0d241f82 48%, transparent),
              linear-gradient(0deg, #0d241f50, transparent 50%);
}
.hero-copy { max-width: 650px; padding: 58px 50px 125px; }
.hero .eyebrow { color: #e6cf9d; }
.hero h1 {
  margin: 18px 0;
  font: 400 clamp(42px, 5.8vw, 72px)/.99 var(--serif);
  letter-spacing: -2px;
}
.hero h1 em { color: #e8d4a6; }
.hero-copy p {
  max-width: 465px;
  color: #f0f0e9;
  font-size: 13px;
  line-height: 1.9;
}
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 22px; }
.chips span {
  border: 1px solid #ffffff55;
  border-radius: 25px;
  padding: 6px 11px;
  color: white;
  font-size: 10px;
}

/* Search */
.search {
  position: relative;
  margin: -59px 28px 0;
  padding: 13px;
  border-radius: 13px;
  background: var(--paper);
  box-shadow: 0 18px 45px #071a152b;
}
.tabs { display: flex; gap: 5px; margin-bottom: 10px; }
.tab {
  border: 0;
  border-radius: 7px;
  padding: 8px 17px;
  background: transparent;
  color: var(--muted);
  font-size: 12px;
}
.tab.active { background: var(--green); color: white; }
.search-fields {
  display: grid;
  grid-template-columns: 1.4fr 1fr .7fr 1fr auto;
  border: 1px solid var(--line);
  border-radius: 9px;
  overflow: hidden;
}
.sf { min-width: 0; padding: 9px 12px; border-right: 1px solid var(--line); }
.sf label { display: block; color: var(--muted); font-size: 10px; }
.sf input, .sf select {
  width: 100%;
  min-width: 0;
  padding-top: 5px;
  border: 0;
  outline: none;
  background: transparent;
  color: var(--ink);
  font-size: 12px;
}
.search-go { margin: 5px; min-width: 48px; font-size: 19px; }
.hint { margin: 9px 3px 0; color: var(--muted); font-size: 10px; }

/* Sections */
.section { padding-top: 52px; }
.section-head {
  display: flex;
  justify-content: space-between;
  align-items: end;
  gap: 15px;
  margin-bottom: 20px;
}
.section-head h2 {
  margin: 7px 0;
  color: var(--green);
  font: 400 clamp(27px, 3vw, 38px)/1.15 var(--serif);
}
.section-head p { margin: 0; color: var(--muted); font-size: 12px; }
.link { color: var(--green); font-size: 12px; font-weight: 750; white-space: nowrap; }
.areas {
  display: grid;
  grid-template-columns: repeat(6, minmax(0, 1fr));
  gap: 12px;
}
.area {
  position: relative;
  height: 120px;
  overflow: hidden;
  border-radius: 10px;
  background: #315143;
  color: white;
}
.area img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform .25s;
}
.area:hover img { transform: scale(1.05); }
.area::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(0deg, #091b16c9, transparent 80%);
}
.area-info { position: absolute; z-index: 1; left: 10px; bottom: 9px; }
.area-info b { display: block; font: 500 15px var(--serif); }
.area-info span { font-size: 9px; }

/* Property cards */
.cards {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 18px;
}
.card {
  min-width: 0;
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: white;
  cursor: pointer;
  transition: transform .2s, box-shadow .2s;
}
.card:hover { transform: translateY(-3px); box-shadow: 0 16px 50px #183d3112; }
.card:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
.cover {
  position: relative;
  height: 220px;
  overflow: hidden;
  background: #e8ede4;
}
.cover img { width: 100%; height: 100%; object-fit: cover; }
.no-photo { display: grid; place-items: center; height: 100%; color: #91a58f; font-size: 48px; }
.ribbon {
  position: absolute;
  top: 11px;
  left: 11px;
  padding: 6px 9px;
  border-radius: 4px;
  background: #173d31ed;
  color: white;
  font-size: 9px;
  font-weight: 800;
}
.cover-count {
  position: absolute;
  bottom: 10px;
  right: 10px;
  border-radius: 4px;
  padding: 4px 7px;
  background: #111b17b8;
  color: white;
  font-size: 10px;
}
.card-body { padding: 15px; }
.type { color: var(--muted); font-size: 10px; letter-spacing: .8px; text-transform: uppercase; }
.card h3 { margin: 7px 0; font: 600 19px/1.3 var(--serif); }
.address { color: var(--muted); font-size: 11px; }
.price { margin: 13px 0 10px; color: var(--green); font-size: 19px; font-weight: 850; }
.price small { color: var(--muted); font-size: 11px; font-weight: 500; }
.facts {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  padding-top: 10px;
  border-top: 1px solid var(--line);
  color: #68756b;
  font-size: 10px;
}
.empty {
  grid-column: 1 / -1;
  padding: 30px;
  border: 1px dashed #ccd4c9;
  border-radius: 12px;
  background: white;
  color: var(--muted);
  text-align: center;
}
.error {
  padding: 14px;
  border: 1px solid #edc5b7;
  border-radius: 8px;
  background: #fff4ef;
  color: #863d2a;
  font-size: 12px;
}

/* Property type blocks */
.types {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 12px;
}
.type-card {
  position: relative;
  min-height: 170px;
  overflow: hidden;
  border-radius: 11px;
  background: #23493b;
  color: white;
}
.type-card img { width: 100%; height: 100%; position: absolute; object-fit: cover; }
.type-card::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(0deg, #0a241dcc, transparent 80%);
}
.type-info { position: absolute; z-index: 1; left: 13px; bottom: 12px; }
.type-info b { display: block; font: 500 20px var(--serif); }
.type-info span { font-size: 10px; }
.cta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  margin: 55px auto;
  padding: 30px;
  border-radius: 15px;
  background: #e9ede4;
}
.cta h2 { margin: 7px 0; font: 400 30px var(--serif); color: var(--green); }
.cta p { margin: 0; color: var(--muted); font-size: 12px; }
footer { margin-top: 40px; padding: 30px 0; border-top: 1px solid var(--line); background: #f3f2ea; }
.footer-inner { display: flex; justify-content: space-between; gap: 24px; flex-wrap: wrap; }
footer p, footer small { max-width: 520px; color: var(--muted); font-size: 11px; }
.footer-links { display: flex; gap: 16px; flex-wrap: wrap; font-size: 11px; color: #5e6b60; }

/* Modals */
.overlay {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 18px;
  background: #0b1b16c9;
  backdrop-filter: blur(4px);
}
.dialog {
  width: min(100%, 980px);
  max-height: calc(100dvh - 36px);
  overflow: auto;
  border-radius: 14px;
  background: var(--paper);
}
.dialog-head {
  position: sticky;
  top: 0;
  z-index: 5;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 18px;
  border-bottom: 1px solid var(--line);
  background: #fffefaf2;
}
.dialog-label { color: var(--green); font-size: 10px; font-weight: 850; letter-spacing: 1.5px; }
.x {
  width: 36px;
  height: 36px;
  border: 0;
  border-radius: 8px;
  background: var(--soft);
  color: var(--green);
  font-size: 22px;
}
.detail-layout { display: grid; grid-template-columns: 1.05fr .95fr; }
.gallery { min-width: 0; background: #17251e; }
.gallery-main {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  height: 420px;
  background: #17251e;
}
.gallery-main > img { width: 100%; height: 100%; object-fit: contain; }
.gallery-empty { color: #bdc9bd; font-size: 60px; }
.arrow {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  width: 40px;
  height: 40px;
  padding: 0;
  border: 0;
  border-radius: 50%;
  background: #fffefaed;
  color: var(--green);
  font-size: 25px;
}
.prev { left: 12px; }
.next { right: 12px; }
.counter {
  position: absolute;
  right: 12px;
  bottom: 12px;
  padding: 5px 8px;
  border-radius: 5px;
  background: #0b1714b8;
  color: white;
  font-size: 10px;
}
.thumbs { display: flex; gap: 8px; padding: 10px; overflow-x: auto; background: #17251e; }
.thumb {
  flex: 0 0 72px;
  height: 54px;
  padding: 0;
  overflow: hidden;
  border: 2px solid transparent;
  border-radius: 5px;
  background: #31483b;
}
.thumb img { width: 100%; height: 100%; object-fit: cover; }
.thumb.active { border-color: var(--gold); }
.detail-body { min-width: 0; padding: 24px; }
.detail-body h2 {
  margin: 10px 0;
  color: var(--green);
  font: 400 clamp(26px, 3vw, 36px)/1.1 var(--serif);
  overflow-wrap: anywhere;
}
.detail-price { margin: 14px 0; color: var(--green); font-size: 28px; font-weight: 850; }
.detail-price small { color: var(--muted); font-size: 12px; font-weight: 500; }
.detail-facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 19px 0; }
.fact { padding: 10px 8px; border: 1px solid var(--line); border-radius: 8px; background: #f6f6ef; }
.fact strong { display: block; color: var(--green); font-size: 17px; }
.fact span { display: block; color: var(--muted); font-size: 9px; text-transform: uppercase; }
.detail-title { margin: 22px 0 9px; color: var(--green); font: 600 18px var(--serif); }
.description { color: #46554b; font-size: 12px; line-height: 1.9; white-space: pre-wrap; overflow-wrap: anywhere; }
.amenities { display: flex; flex-wrap: wrap; gap: 7px; }
.amenity { padding: 6px 9px; border-radius: 30px; background: var(--soft); color: #41564a; font-size: 10px; }
.contact-actions { display: flex; flex-direction: column; gap: 8px; margin-top: 20px; }
.contact-small { color: var(--muted); font-size: 11px; }

/* Forms */
.form-dialog { width: min(100%, 560px); }
.form-content { padding: 22px; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 13px; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field.full { grid-column: 1 / -1; }
.field label { color: #5e6f63; font-size: 10px; font-weight: 800; }
.field input, .field select, .field textarea {
  width: 100%;
  min-width: 0;
  padding: 11px 12px;
  border: 1px solid #dfe4da;
  border-radius: 7px;
  background: white;
  color: var(--ink);
  font-size: 13px;
}
.field textarea { min-height: 100px; resize: vertical; }
.note { color: var(--muted); font-size: 10px; }
.form-actions { display: flex; justify-content: flex-end; gap: 9px; flex-wrap: wrap; margin-top: 18px; }
.status { margin-bottom: 14px; padding: 10px 12px; border-radius: 7px; background: var(--soft); color: var(--green); font-size: 12px; }
.status.bad { background: #fff0eb; color: #8d3928; }
.previews { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 8px; }
.previews img { width: 60px; height: 52px; object-fit: cover; border: 1px solid var(--line); border-radius: 5px; }
.toast {
  position: fixed;
  bottom: 20px;
  left: 50%;
  z-index: 150;
  transform: translateX(-50%);
  max-width: 90vw;
  padding: 12px 16px;
  border-radius: 8px;
  background: var(--green);
  color: white;
  font-size: 12px;
}
@media(max-width:1000px) {
  .search-fields { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .sf { border-bottom: 1px solid var(--line); }
  .sf:nth-child(2n) { border-right: 0; }
  .search-go { min-height: 44px; }
  .areas { grid-template-columns: repeat(3, minmax(0,1fr)); }
  .types { grid-template-columns: repeat(3, minmax(0,1fr)); }
  .cards { grid-template-columns: repeat(2, minmax(0,1fr)); }
}
@media(max-width:720px) {
  .wrap { width: calc(100% - 26px); }
  header { height: 64px; padding: 0 12px; }
  .brand strong { font-size: 11px; }
  .mark { width: 31px; height: 31px; }
  .menu { display: block; }
  .nav {
    display: none;
    position: absolute;
    top: 63px;
    left: 0;
    right: 0;
    padding: 15px;
    background: var(--paper);
    border-bottom: 1px solid var(--line);
  }
  .nav.open { display: flex; flex-direction: column; align-items: stretch; gap: 0; }
  .nav a { padding: 10px 4px; border-bottom: 1px solid var(--line); }
  .nav-actions { gap: 5px; }
  .nav-actions .btn { padding: 9px 10px; font-size: 10px; }
  .hero { padding-top: 10px; }
  .hero-panel { min-height: 390px; border-radius: 12px; }
  .hero-copy { padding: 40px 20px 118px; }
  .hero h1 { font-size: clamp(39px, 11vw, 58px); letter-spacing: -1.5px; }
  .hero-copy p { font-size: 12px; }
  .search { margin: -58px 7px 0; padding: 9px; }
  .sf { padding: 8px; }
  .sf label { font-size: 9px; }
  .sf input, .sf select { font-size: 11px; }
  .search-go { grid-column: 1 / -1; }
  .section { padding-top: 40px; }
  .section-head { align-items: flex-start; }
  .section-head h2 { font-size: 28px; }
  .areas { grid-template-columns: repeat(3, minmax(0,1fr)); gap: 7px; }
  .area { height: 95px; }
  .area-info { left: 7px; bottom: 6px; }
  .area-info b { font-size: 12px; }
  .area-info span { font-size: 8px; }
  .cards { grid-template-columns: 1fr; gap: 12px; }
  .card { display: grid; grid-template-columns: 40% 60%; }
  .cover { height: auto; min-height: 190px; }
  .card-body { min-width: 0; padding: 12px; }
  .card h3 { font-size: 17px; }
  .price { font-size: 16px; margin: 10px 0; }
  .facts { gap: 7px; }
  .types { grid-template-columns: repeat(2,minmax(0,1fr)); gap: 8px; }
  .type-card { min-height: 135px; }
  .type-info b { font-size: 18px; }
  .cta { align-items: flex-start; flex-direction: column; padding: 22px 19px; margin: 40px auto; }
  .footer-inner { flex-direction: column; }
  .overlay { padding: 0; }
  .dialog { width: 100%; height: 100dvh; max-height: 100dvh; border-radius: 0; }
  .detail-layout { grid-template-columns: 1fr; }
  .gallery-main { height: 36vh; min-height: 215px; max-height: 360px; }
  .detail-body { padding: 17px 15px; }
  .detail-body h2 { font-size: 29px; }
  .form-content { padding: 17px; }
  .form-grid { grid-template-columns: 1fr; }
  .field.full { grid-column: auto; }
}
@media(prefers-reduced-motion:reduce) { html { scroll-behavior: auto; } * { transition: none !important; } }
</style>
</head>
<body>

<header>
  <a class="brand" href="#top">
    <span class="mark">✳</span>
    <span><strong>PHUKET PROPERTY</strong><small>THAILAND</small></span>
  </a>
  <nav class="nav" id="nav">
    <a href="#properties" data-offer-nav="sale">Buy</a>
    <a href="#properties" data-offer-nav="rent">Rent</a>
    <a href="#types" data-kind="Villa">Villas</a>
    <a href="#types" data-kind="Condo">Condos</a>
    <a href="#types" data-kind="Land">Land</a>
    <a href="#areas">Areas</a>
  </nav>
  <div class="nav-actions">
    <button class="btn light" id="loginBtn">Log in</button>
    <button class="btn primary" id="listBtn">List Property</button>
    <button class="menu" id="menuBtn" aria-label="Open menu" aria-expanded="false">☰</button>
  </div>
</header>

<main id="top">
  <section class="hero wrap">
    <div class="hero-panel">
      <img class="hero-image"
        src="https://images.unsplash.com/photo-1500375592092-40eb2168fd21?auto=format&fit=crop&w=1800&q=85"
        alt="Turquoise tropical sea">
      <div class="hero-copy">
        <div class="eyebrow">PHUKET · THAILAND</div>
        <h1>Find Your<br><em>Perfect Place.</em></h1>
        <p>Thoughtfully selected villas, condos, homes and land across Phuket. Find a place to stay, invest or call home.</p>
        <div class="chips"><span>Rentals</span><span>Homes for sale</span><span>Island living</span></div>
      </div>
    </div>

    <form class="search" id="searchForm">
      <div class="tabs">
        <button class="tab active" type="button" data-offer="rent">Rent</button>
        <button class="tab" type="button" data-offer="sale">Sale</button>
      </div>
      <div class="search-fields">
        <div class="sf">
          <label for="query">Location or keyword</label>
          <input id="query" placeholder="e.g. Rawai, sea view">
        </div>
        <div class="sf">
          <label for="kind">Property type</label>
          <select id="kind">
            <option value="">Any type</option>
            <option>Villa</option><option>Condo</option><option>House</option>
            <option>Land</option><option>Townhouse</option><option>Apartment</option>
            <option>Commercial</option><option>Other</option>
          </select>
        </div>
        <div class="sf">
          <label for="beds">Bedrooms</label>
          <select id="beds">
            <option value="">Any</option><option value="1">1+</option>
            <option value="2">2+</option><option value="3">3+</option>
            <option value="4">4+</option><option value="5">5+</option>
          </select>
        </div>
        <div class="sf">
          <label for="maxPrice">Max price (THB)</label>
          <select id="maxPrice">
            <option value="">Any price</option>
            <option value="20000">฿20,000</option>
